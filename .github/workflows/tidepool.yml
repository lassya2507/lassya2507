name: Repo Aquarium

on:
  schedule:
    - cron: "27 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tidepool/**"
      - ".github/workflows/tidepool.yml"

concurrency:
  group: repo-aquarium
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate aquarium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tidepool/simulate.py

      - name: Commit generated frame
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/tidepool.svg tidepool/state.json
          if git diff --cached --quiet; then
            echo "No aquarium changes."
          else
            git commit -m "Update repo aquarium [skip ci]"
            git push
          fi
