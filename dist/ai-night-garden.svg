<svg width="100%" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Prarthana's AI Night Garden</title>
  <desc id="desc">A whimsical animated night garden with floating AI topic orbs, stars, petals, and fireflies surrounding Prarthana.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171427"/>
      <stop offset="55%" stop-color="#241936"/>
      <stop offset="100%" stop-color="#101723"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd8ec" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd8ec" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="360" rx="22" fill="url(#bg)"/>

  <g fill="#fff7fb">
    <circle cx="74" cy="54" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="141" cy="88" r="1.6"><animate attributeName="opacity" values="1;.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="64" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="706" cy="113" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="566" cy="48" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="43" r="1.4"><animate attributeName="opacity" values="1;.25;1" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="380" cy="170" r="88" fill="url(#moonGlow)" opacity=".35">
    <animate attributeName="r" values="82;94;82" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="170" r="54" fill="#f8d5eb" opacity=".96"/>
  <circle cx="397" cy="154" r="52" fill="#241936"/>
  <text x="380" y="176" text-anchor="middle" fill="#fff8fc" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">Prarthana</text>
  <rect x="289" y="184" width="182" height="24" rx="12" fill="#120d1b" opacity=".86" stroke="#ffb6d8" stroke-opacity=".35"/>
  <text x="380" y="200" text-anchor="middle" fill="#fff8fc" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic" font-weight="600">building thoughtful AI systems ✨</text>

  <ellipse cx="380" cy="170" rx="255" ry="112" fill="none" stroke="#d9a7ff" stroke-opacity=".16" stroke-dasharray="5 10"/>
  <ellipse cx="380" cy="170" rx="185" ry="78" fill="none" stroke="#ff9fcb" stroke-opacity=".13" stroke-dasharray="3 9"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="13" text-anchor="middle">
    <g transform="translate(145 145)">
      <animateTransform attributeName="transform" type="translate" values="145 145;151 137;145 145" dur="5.6s" repeatCount="indefinite"/>
      <circle r="44" fill="#ff9fcb" opacity=".16"/>
      <circle r="34" fill="#ff9fcb" opacity=".2" stroke="#ffc3df" stroke-opacity=".55"/>
      <text y="5" fill="#ffe6f1" font-weight="700">LLM Systems</text>
    </g>
    <g transform="translate(610 126)">
      <animateTransform attributeName="transform" type="translate" values="610 126;603 136;610 126" dur="6.3s" repeatCount="indefinite"/>
      <circle r="42" fill="#c9a7ff" opacity=".16"/>
      <circle r="32" fill="#c9a7ff" opacity=".2" stroke="#e4d4ff" stroke-opacity=".55"/>
      <text y="5" fill="#f0e6ff" font-weight="700">AI Security</text>
    </g>
    <g transform="translate(184 270)">
      <animateTransform attributeName="transform" type="translate" values="184 270;191 263;184 270" dur="6.8s" repeatCount="indefinite"/>
      <circle r="40" fill="#91d7ff" opacity=".14"/>
      <circle r="30" fill="#91d7ff" opacity=".18" stroke="#cdeeff" stroke-opacity=".5"/>
      <text y="5" fill="#dcf5ff" font-weight="700">RAG</text>
    </g>
    <g transform="translate(572 275)">
      <animateTransform attributeName="transform" type="translate" values="572 275;565 268;572 275" dur="5.9s" repeatCount="indefinite"/>
      <circle r="45" fill="#9ee7d2" opacity=".13"/>
      <circle r="35" fill="#9ee7d2" opacity=".18" stroke="#d6fff3" stroke-opacity=".5"/>
      <text y="5" fill="#e0fff6" font-weight="700">ML Infra</text>
    </g>
    <g transform="translate(382 305)">
      <animateTransform attributeName="transform" type="translate" values="382 305;382 296;382 305" dur="6.1s" repeatCount="indefinite"/>
      <circle r="39" fill="#ffb7a7" opacity=".13"/>
      <circle r="29" fill="#ffb7a7" opacity=".18" stroke="#ffd9d0" stroke-opacity=".5"/>
      <text y="5" fill="#ffe8e2" font-weight="700">Agents</text>
    </g>
  </g>

  <g fill="#ffe680" filter="url(#softGlow)">
    <circle cx="108" cy="220" r="2.4"><animate attributeName="cy" values="220;203;220" dur="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="676" cy="230" r="2.2"><animate attributeName="cy" values="230;214;230" dur="5.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="511" cy="82" r="2"><animate attributeName="cy" values="82;70;82" dur="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#ffacd2" opacity=".8">
    <ellipse cx="95" cy="105" rx="4" ry="8" transform="rotate(-28 95 105)"><animateTransform attributeName="transform" type="translate" values="0 0;18 18;0 0" dur="8s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="688" cy="175" rx="4" ry="8" transform="rotate(35 688 175)"><animateTransform attributeName="transform" type="translate" values="0 0;-16 20;0 0" dur="9s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="285" cy="83" rx="3.5" ry="7" transform="rotate(18 285 83)"><animateTransform attributeName="transform" type="translate" values="0 0;10 16;0 0" dur="7.2s" repeatCount="indefinite"/></ellipse>
  </g>

  <text x="380" y="344" text-anchor="middle" fill="#cdbdde" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic">a tiny animated map of the things I keep coming back to ♡</text>
</svg>
